[build]
  command = "npm install && npm --prefix client install && npm --prefix client run build"
  publish = "client/dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/setup"
  to = "/.netlify/functions/setup"
  status = 200
  force = true

[[redirects]]
  from = "/api/p/:token"
  to = "/.netlify/functions/resolve"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
